{% extends "base.html" %}
{% load tailwind_cli %}

{% block title %}Task Manager | Login{% endblock %}

{% block content %}

    <h1 class="text-2xl font-bold mb-6">Вход</h1>
    <form method="post" action="">
        {% csrf_token %}

        <label for="id_username" class="block mt-3">Имя пользователя:</label>
        <input type="text" id="id_username" name="username" value="{{ username }}"
               class="block w-full border border-slate-200 rounded px-4 py-2 mt-2">

        <label for="id_password" class="block mt-3">Пароль:</label>
        <input type="password" id="id_password" name="password" value=""
               class="block w-full border border-slate-200 rounded px-4 py-2 mt-2">

        <button type="submit"
                class="w-full mt-3 py-2 bg-indigo-600 text-white rounded hover:underline">
            Войти
        </button>
    </form>

{% endblock %}
