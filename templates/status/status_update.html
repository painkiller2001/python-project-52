{% extends "base.html" %}
{% load tailwind_cli %}

{% block title %}Task Manager | Status update{% endblock %}

{% block content %}

    <h1 class="text-2xl font-bold mb-6">Изменение данных статуса</h1>
    <form method="post" action="">
        {% csrf_token %}

    <label for="id_name" class="block mt-3">Имя:</label>
    <input type="text" id="id_name" name="name" value="{{ status.name }}"
       class="block w-full border border-slate-200 rounded px-4 py-2 mt-2">

        <button type="submit"
                class="w-full mt-3 py-2 bg-indigo-600 text-white rounded hover:underline">
            Изменить
        </button>

    </form>

{% endblock %}
