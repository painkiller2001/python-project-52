{% extends "base.html" %}
{% load tailwind_cli %}

{% block title %}Task Manager | Task update{% endblock %}

{% block content %}

    <h1 class="text-2xl font-bold mb-6">Изменить задачу</h1>
    <form method="post" action="">
        {% csrf_token %}

        <label for="id_name" class="block mt-3">Имя:</label>
        <input type="text" id="id_name" name="name" value="{{ task.name }}"
               class="block w-full border border-slate-200 rounded px-4 py-2 mt-2">

        <label for="id_description" class="block mt-3">Описание:</label>
        <input type="text" id="id_description" name="description" value="{{ task.description }}"
               class="block w-full border border-slate-200 rounded px-4 py-2 mt-2">

        <label class="block mt-3">Статус:</label>
        {{ form.status }}

        <label class="block mt-3">Исполнитель:</label>
        {{ form.performer }}

        <button type="submit"
                class="w-full mt-3 py-2 bg-indigo-600 text-white rounded hover:underline">
            Сохранить
        </button>
    </form>

{% endblock %}
