name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13.14"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run Linters
        run: |
          uv run ruff check .

      - name: Run Tests
        run: |
          .venv/bin/pytest
